name: Test AltStore Source

on:
  pull_request:
    paths:
      - 'altstore/**'
      - 'iosApp/scripts/*altstore*'
      - '.github/workflows/altstore-source-test.yml'
  push:
    paths:
      - 'altstore/**'
      - 'iosApp/scripts/*altstore*'
      - '.github/workflows/altstore-source-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s iosApp/scripts -p 'test_generate_altstore_source.py' -v
