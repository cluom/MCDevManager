name: Windows Widgets

on:
  workflow_dispatch:
    inputs:
      build_desktop:
        description: '同时打包带小组件登录共享的主客户端'
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  widgets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build verified standalone widget package
        shell: pwsh
        run: ./windowsWidgets/build.ps1 -BuildId '${{ github.run_id }}-${{ github.run_attempt }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-widgets-${{ github.run_id }}-${{ github.run_attempt }}
          path: windowsWidgets/dist/*.zip
          if-no-files-found: error
      - uses: actions/setup-java@v4
        if: inputs.build_desktop
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.build_desktop
      - name: Build desktop session bridge
        if: inputs.build_desktop
        shell: pwsh
        run: |
          ./gradlew.bat :shared:jvmTest :desktopApp:packagePortable --no-daemon
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
      - uses: actions/upload-artifact@v4
        if: inputs.build_desktop
        with:
          name: windows-desktop-widget-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktopApp/build/release/portable/*.zip
          if-no-files-found: error
